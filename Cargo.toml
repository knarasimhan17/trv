[package]
name = "trv"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A terminal code-review interface with immutable local revisions"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
unicode-width = "0.2"
